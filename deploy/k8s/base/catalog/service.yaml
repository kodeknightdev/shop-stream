apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: shop-stream
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalog
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: grpc
    port: 8081
    targetPort: grpc
    appProtocol: grpc
